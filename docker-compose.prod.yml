version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: recruiter_app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - storage-data:/var/www/storage
    networks:
      - recruiter-network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: recruiter_queue
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - storage-data:/var/www/storage
    networks:
      - recruiter-network

  nginx:
    image: nginx:alpine
    container_name: recruiter_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./backend:/var/www
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - recruiter-network

networks:
  recruiter-network:

volumes:
  storage-data: