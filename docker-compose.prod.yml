services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: recruiter_app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - recruiter-network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: recruiter_queue
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - recruiter-network

  nginx:
    image: nginx:alpine
    container_name: recruiter_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - recruiter-network

networks:
  recruiter-network: