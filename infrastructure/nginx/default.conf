server {
    listen 80;
    server_name recruitsignal.app www.recruitsignal.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name recruitsignal.app www.recruitsignal.app;
    # path to your SSL certificate and key files
    ssl_certificate /etc/letsencrypt/live/recruitsignal.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruitsignal.app/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/public;

        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    }
}