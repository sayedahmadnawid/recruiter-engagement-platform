on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/github-actions-cicd
      - feature/resume-ai-parser # <-- Added your active feature branch

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Backend Dependencies
        working-directory: backend
        run: composer install --no-interaction

      - name: Ensure Storage Directories Exist
        working-directory: backend
        run: |
          mkdir -p storage/framework/views
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/cache
          mkdir -p storage/app/private

      - name: Copy Environment File
        working-directory: backend
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate Application Key
        working-directory: backend
        run: php artisan key:generate

      - name: Run Laravel Tests
        working-directory: backend
        run: php artisan test

      - name: Deploy to EC2 via Native SSH
        run: |
          eval $(ssh-agent -s)

          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /path/to/your/app
            git pull origin main
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build
            docker exec recruiter_app php artisan config:clear
            docker exec recruiter_app php artisan config:cache
            docker exec recruiter_queue php artisan queue:restart
          EOF
