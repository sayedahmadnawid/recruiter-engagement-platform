name: Test Native SSH Connection

on:
  push:
    branches:
      - main
      - feature/github-actions-cicd

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: SSH via Native Linux Client
        run: |
          # 1. Start the SSH agent
          eval $(ssh-agent -s)
          
          # 2. Save the key from secrets to a temporary file and set permissions
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          # 3. Add the key to the agent
          ssh-add private_key.pem
          
          # 4. Run SSH with a strict 15-second timeout and Verbose debugging flags (-vvv)
          ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -vvv ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'Native connection works! 🚀'; hostname"
